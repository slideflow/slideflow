[build-system]
requires = ["setuptools", "versioneer[toml]"]
build-backend = "setuptools.build_meta"

[versioneer]
VCS = git
style = pep440
versionfile_source = slideflow/_version.py
versionfile_build = slideflow/_version.py
tag_prefix =
parentdir_prefix = slideflow-

[flake8]
exclude =
    .git,
    .tox,
    build,
    dist,
    docs-source,
    slideflow/_version.py,
    versioneer.py
